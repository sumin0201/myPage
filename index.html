<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ec">
  <meta name="description" content="이름을 입력하고 따뜻한 환영 인사를 받아보세요.">
  <title>어서오세요 — 이름을 알려주세요</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #19332c;
      --muted: #63766e;
      --green: #245b47;
      --green-dark: #194535;
      --paper: #f4f2ec;
      --line: #dce3da;
      --white: #fffefa;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 14%, rgba(221, 230, 212, .72), transparent 34%),
        radial-gradient(ellipse at 92% 88%, rgba(232, 222, 197, .65), transparent 30%),
        var(--paper);
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }
    .page { width: min(100%, 920px); }
    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .brand { display: inline-flex; align-items: center; gap: 9px; color: var(--green); }
    .brand-mark { width: 10px; height: 10px; border-radius: 50%; background: #87a888; box-shadow: 0 0 0 5px rgba(135,168,136,.15); }
    .card {
      position: relative;
      overflow: hidden;
      min-height: 490px;
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      border: 1px solid rgba(25, 69, 53, .08);
      border-radius: 26px;
      background: var(--white);
      box-shadow: 0 28px 80px rgba(38, 58, 44, .10), 0 3px 10px rgba(38, 58, 44, .04);
    }
    .content { position: relative; z-index: 1; padding: clamp(36px, 7vw, 76px); align-self: center; }
    .eyebrow { display: flex; align-items: center; gap: 9px; margin: 0 0 22px; color: #66826f; font-size: 12px; font-weight: 800; letter-spacing: .14em; }
    .eyebrow::before { content: ""; width: 25px; height: 1px; background: #9cb69e; }
    h1 { margin: 0; font-size: clamp(36px, 5.3vw, 58px); line-height: 1.2; letter-spacing: -.055em; font-weight: 750; }
    h1 span { color: var(--green); }
    .intro { max-width: 370px; margin: 18px 0 34px; color: var(--muted); font-size: 15px; line-height: 1.8; word-break: keep-all; }
    label { display: block; margin-bottom: 9px; color: #40574d; font-size: 13px; font-weight: 700; }
    .field { display: flex; gap: 9px; }
    input {
      width: 100%; min-width: 0; height: 54px; padding: 0 16px;
      border: 1px solid var(--line); border-radius: 12px; outline: none;
      background: #fff; color: var(--ink); font: inherit; font-size: 15px;
      transition: border-color .2s, box-shadow .2s;
    }
    input::placeholder { color: #a0ada4; }
    input:focus { border-color: #6e9b7f; box-shadow: 0 0 0 4px rgba(110,155,127,.15); }
    button {
      flex: 0 0 auto; height: 54px; padding: 0 21px; border: 0; border-radius: 12px;
      color: white; background: var(--green); font: inherit; font-size: 14px; font-weight: 750;
      cursor: pointer; transition: background .2s, transform .2s;
    }
    button:hover { background: var(--green-dark); transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid #9dbfa4; outline-offset: 3px; }
    .greeting { min-height: 28px; margin: 18px 0 0; color: var(--green); font-size: 18px; font-weight: 750; }
    .greeting:empty { display: none; }
    .greeting.show { animation: arrive .35s ease both; }
    .art {
      position: relative; display: grid; place-items: center; overflow: hidden;
      background: linear-gradient(155deg, #e6ecdf, #d7e3d4 55%, #c7d8c9);
    }
    .art::before, .art::after { content: ""; position: absolute; border: 1px solid rgba(36,91,71,.13); border-radius: 50%; }
    .art::before { width: 340px; height: 340px; }
    .art::after { width: 440px; height: 440px; }
    .sun { position: absolute; top: 14%; right: 15%; width: 58px; height: 58px; border-radius: 50%; background: #f7f0d9; box-shadow: 0 0 48px rgba(247,240,217,.8); }
    .plant { position: relative; z-index: 1; width: 210px; height: 260px; margin-top: 35px; }
    .stem { position: absolute; bottom: 45px; left: 103px; width: 3px; height: 170px; border-radius: 3px; background: #67876b; transform: rotate(4deg); transform-origin: bottom; }
    .leaf { position: absolute; width: 72px; height: 38px; border-radius: 100% 0 100% 0; background: linear-gradient(135deg, #91ad88, #527b60); }
    .leaf.one { left: 29px; top: 88px; transform: rotate(20deg); }
    .leaf.two { left: 105px; top: 49px; transform: scaleX(-1) rotate(17deg); }
    .leaf.three { left: 30px; top: 151px; transform: rotate(12deg) scale(.88); background: linear-gradient(135deg, #a5bb91, #698a68); }
    .leaf.four { left: 105px; top: 115px; transform: scaleX(-1) rotate(18deg) scale(.88); background: linear-gradient(135deg, #a5bb91, #698a68); }
    .pot { position: absolute; bottom: 12px; left: 62px; width: 91px; height: 65px; border-radius: 8px 8px 24px 24px; background: linear-gradient(110deg, #bd886b, #d5a184); box-shadow: 0 16px 24px rgba(76,93,70,.15); }
    .pot::before { content: ""; position: absolute; top: -8px; left: -5px; width: 101px; height: 15px; border-radius: 8px; background: #c79173; }
    .caption { position: absolute; bottom: 25px; color: #5e7865; font-size: 11px; font-weight: 700; letter-spacing: .12em; }
    footer { margin-top: 20px; text-align: center; color: #87948b; font-size: 11px; letter-spacing: .04em; }
    @keyframes arrive { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 650px) {
      body { padding: 18px; }
      .topline { margin: 0 3px 14px; }
      .card { min-height: auto; grid-template-columns: 1fr; border-radius: 22px; }
      .content { padding: 42px 28px 34px; }
      .intro { margin-bottom: 27px; }
      .art { min-height: 230px; }
      .plant { transform: scale(.75); margin-top: 25px; }
      .sun { top: 13%; right: 20%; width: 42px; height: 42px; }
      .caption { bottom: 14px; }
    }
    @media (max-width: 380px) { .field { flex-direction: column; } button { width: 100%; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span> A LITTLE WELCOME</div>
      <span>YOUR DAY, STARTS HERE</span>
    </div>
    <section class="card" aria-labelledby="page-title">
      <div class="content">
        <p class="eyebrow">반가워요, 오늘</p>
        <h1 id="page-title">이름을 알려주시면<br><span>환영할게요.</span></h1>
        <p class="intro">이곳에 오신 걸 환영해요. 이름을 입력하고 버튼을 눌러 따뜻한 인사를 받아보세요.</p>
        <form id="welcome-form">
          <label for="name">어떻게 불러드릴까요?</label>
          <div class="field">
            <input id="name" name="name" type="text" placeholder="이름을 입력해 주세요" autocomplete="given-name" maxlength="40" required>
            <button type="submit">인사 받기 <span aria-hidden="true">↗</span></button>
          </div>
        </form>
        <p class="greeting" id="greeting" aria-live="polite"></p>
      </div>
      <div class="art" aria-hidden="true">
        <div class="sun"></div>
        <div class="plant">
          <div class="stem"></div><div class="leaf one"></div><div class="leaf two"></div>
          <div class="leaf three"></div><div class="leaf four"></div><div class="pot"></div>
        </div>
        <span class="caption">GROW AT YOUR OWN PACE</span>
      </div>
    </section>
    <footer>오늘도 당신의 속도로, 좋은 하루를 시작해요.</footer>
  </main>
  <script>
    const form = document.querySelector("#welcome-form");
    const nameInput = document.querySelector("#name");
    const greeting = document.querySelector("#greeting");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = nameInput.value.trim();
      if (!name) {
        nameInput.setCustomValidity("이름을 입력해 주세요.");
        nameInput.reportValidity();
        nameInput.addEventListener("input", () => nameInput.setCustomValidity(""), { once: true });
        return;
      }
      greeting.textContent = `${name} 님, 어서오세요!`;
      greeting.classList.remove("show");
      requestAnimationFrame(() => greeting.classList.add("show"));
    });
  </script>
</body>
</html>
